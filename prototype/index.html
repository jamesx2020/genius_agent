<script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state;try{state=JSON.parse(localStorage.getItem('zhuxu-prototype-v1'))}catch{}state={role:'项目经理',decision:null,option:'A',extra:[],...(state||{})};let view='overview',tab='all',scenario='delivery_delay',search='';
const save=()=>localStorage.setItem('zhuxu-prototype-v1',JSON.stringify(state));const status=()=>state.decision==='approved'?'已完成':state.decision==='returned'?'待修改':'待审批';
function toast(t){$('#toast').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('#toast').innerHTML='',3500)}
function nav(v){if(!currentUser()){render();return}view=v;search='';render();window.scrollTo(0,0)}
const badge=(t,c='blue')=>`<span class="badge ${c}">${t}</span>`;
const baseTasks=()=>[{id:'WF-2026-0142',title:'电缆延期交付 · 协同处置',sub:'PO-2026-0086 · 低压电缆 200 米',type:'交货延期',role:'三岗位协同',status:status(),color:state.decision==='approved'?'green':'amber',time:'今天 10:42'},{id:'WF-2026-0141',title:'二层消防管材 · 采购申请',sub:'PR-2026-0039 · 镀锌钢管 320 米',type:'材料采购',role:'采购 Agent',status:'待补资料',color:'purple',time:'今天 09:25'},{id:'WF-2026-0140',title:'空调设备首付款 · 单据审核',sub:'PAY-2026-0021 · ¥ 128,000.00',type:'付款审核',role:'财务 Agent',status:state.financeReviewed?'已完成':'待审核',color:state.financeReviewed?'green':'blue',time:state.financeReviewed?'刚刚':'昨天 16:30'}];
function taskTable(){const rows=[...state.extra,...baseTasks()].filter(t=>(tab==='all'||t.status===tab)&&(!search||(t.title+t.id+t.type).includes(search)));return `<div class="tablewrap"><table><thead><tr><th>任务 / 关联单据</th><th>负责岗位</th><th>状态</th><th>更新时间</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr class="linkrow"><td><b>${esc(t.title)}</b><small>${esc(t.sub)}</small></td><td class="nowrap">${esc(t.role)}</td><td>${badge(esc(t.status),t.color)}</td><td class="nowrap" style="color:#94a0af;font-size:11px">${esc(t.time)}</td><td><button class="textbtn" onclick="${t.id==='WF-2026-0142'?"nav('workflow')":`taskDetail('${t.id}')`}">查看 →</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">暂无匹配的任务</td></tr>'}</tbody></table></div>`}
function agents(){return `<div class="card"><div class="sectionhead"><h2>岗位协作</h2>${badge('3 个在线','green')}</div><div class="agents">${[['工','项目经理 Agent','green','已完成施工计划影响评估'],['采','采购 Agent','blue','已整理 2 个可执行方案'],['财','财务 Agent','purple','已核对预算及新增采购成本']].map(a=>`<div class="agentrow"><div class="agenticon ${a[2]}">${a[0]}</div><div class="agenttext"><b>${a[1]}</b><p>${a[3]}</p></div><span class="dot" style="margin-top:7px"></span></div>`).join('')}</div></div>`}
function activity(){return `<div class="card space"><div class="sectionhead"><h2>最新动态</h2><small>今天</small></div><div class="timeline">${state.decision?`<div class="event"><small>刚刚 · ${esc(state.role)}</small><p>${state.decision==='approved'?'已批准方案 '+state.option+'，模拟订单变更已完成':'已退回方案，等待采购补充处理'}。</p></div>`:''}<div class="event"><small>10:42 · 系统</small><p>电缆延期处理方案已提交，等待项目负责人审批。</p></div><div class="event"><small>10:38 · 财务 Agent</small><p>预算检查通过，方案 A 无新增采购成本。</p></div><div class="event"><small>10:32 · 项目经理 Agent</small><p>首批交货可满足前三天施工需求。</p></div></div></div>`}
function title(k,h,p,actions=''){return `<div class="topline"><div><div class="eyebrow">${k}</div><h1>${h}</h1><p class="subtitle">${p}</p></div><div class="topactions">${actions}</div></div>`}
function overview(){return title('PROJECT OVERVIEW','项目协同，总览全局','上午好，林工。今天有 1 项交付风险需要关注。',`<button onclick="nav('tasks')">查看全部任务</button><button class="primary" onclick="nav('create')">＋ 发起协同</button>`)+`<div class="metrics">${[['进行中任务','8','项','较上周 <b>减少 2 项</b>','◫'],['待人工审批',state.decision?'2':'3','项','其中 1 项交期相关','☷'],['本月采购支出','86.4','万元','预算使用率 <b>68%</b>','↗'],['Agent 已协助完成','24','项','本月累计，待人工复核记录可追溯','✧']].map(m=>`<div class="card metric"><div class="metriclabel">${m[0]}<span>${m[4]}</span></div><div class="metricvalue">${m[1]}<small>${m[2]}</small></div><div class="metricfoot">${m[3]}</div></div>`).join('')}</div><div class="layout"><div><div class="card"><div class="sectionhead"><h2>需要关注的协同任务</h2><button class="textbtn" onclick="nav('tasks')">全部任务 ↗</button></div>${!state.decision?`<div class="alert"><span>◷</span><div><b>电缆交付延期，处理方案待确认</b>三个岗位已完成分析，建议采用分批交付，避免影响三层施工。</div><button class="textbtn" style="margin-left:auto;white-space:nowrap" onclick="nav('approval')">去审批 →</button></div>`:''}${tabs()}${taskTable()}</div><div class="card projectstrip"><div class="projectmark">▥</div><div class="projectinfo"><b>滨江科创中心 · 机电安装工程</b><p>项目周期 2026.08 — 2027.03 · 项目负责人 林远</p><div class="progress"><i></i></div></div><div style="text-align:right"><b style="font-size:20px">68<span style="font-size:12px">%</span></b><p class="tiny">计划进度</p></div></div></div><aside class="rightcol">${agents()}${activity()}</aside></div>`}
function tabs(){return `<div class="tabs">${[['all','全部任务'],['待审批','待审批'],['待补资料','待补资料'],['已完成','已完成']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`}

function approval(){const approved=state.decision==='approved',returned=state.decision==='returned';return title('HUMAN REVIEW','交付方案审批','审批绑定当前方案 V1，修改供应商、数量或金额后需重新审批。',`<button onclick="nav('workflow')">查看分析过程</button>`)+`<div class="layout"><div class="card"><div class="sectionhead"><h2>${approved?'审批已完成':returned?'方案已退回':'请选择处理方案'}</h2>${badge(approved?'已批准':returned?'待修改':'待项目负责人审批',approved?'green':'amber')}</div><div class="panelbody"><div class="approvalmeta"><span>申请人：陈敏 · 采购</span><span>提交时间：2026-11-02 10:42</span><span>版本：V1</span></div>${[['A','原供应商分批交付','首批交付 100 米指定规格电缆，剩余 100 米在 11 月 9 日前到场。','¥ 0','不影响','原供应商'],['B','备选供应商补充采购','从备选供应商采购 100 米，原供应商订单相应减量，材料价格与运费合计增加 ¥2,400。','¥ 2,400','不影响','两家供应商']].map(a=>`<label class="option ${state.option===a[0]?'selected':''}"><input type="radio" name="option" value="${a[0]}" ${state.option===a[0]?'checked':''} ${state.decision?'disabled':''} onchange="state.option=this.value;save();render()"><div class="optionmain"><div class="optiontitle">方案 ${a[0]} · ${a[1]} ${a[0]==='A'?badge('推荐','green'):''}</div><p>${a[2]}</p><div class="optionmetrics"><div><b>${a[3]}</b>新增采购成本</div><div><b>${a[4]}</b>施工进度</div><div><b>${a[5]}</b>履约方式</div></div></div></label>`).join('')}<div class="result"><b>执行前置条件</b>确认首批电缆规格与现场需求一致；订单变更前检查报价有效期、预算及订单版本。本原型只执行模拟状态变更。</div><div class="field" style="margin-top:23px"><label for="comment">审批意见${returned?'（已记录）':''}</label><textarea id="comment" placeholder="填写审批意见；退回时请说明需要补充或修改的内容" ${state.decision?'disabled':''}>${esc(state.comment||'')}</textarea></div><p class="note">当前演示身份：${esc(state.role)}。仅项目经理身份可以审批此方案。切换岗位可体验权限限制。</p>${approved?`<div class="alert" style="margin:0;background:#edf9f4;border-color:#d4eee1;color:#29846c"><div><b style="color:#29846c">✓ 方案 ${state.option} 已批准，模拟订单变更已完成</b>操作记录已保存到本浏览器。未向外部系统发出订单或付款。</div></div>`:returned?`<div class="alert" style="margin:0"><div><b>方案已退回采购岗位</b>退回原因：${esc(state.comment)}</div></div><div class="actions"><button onclick="resubmit()">模拟补 function create(){return title('START A WORKFLOW','发起一次项目协同','描述要解决的问题，系统将组织相关岗位协作。')+`<div class="layout"><div class="card"><div class="panelbody"><form id="createform" onsubmit="submitTask(event)"><div class="field"><label>选择业务场景</label><div class="scenarios">${[['delivery_delay','◷','交货延期','评估工期影响，比较补救方案'],['material_purchase','▣','材料采购','整理需求，检查预算与报价'],['payment_review','▤','付款审核','核对订单、验收记录和发票']].map(x=>`<button type="button" class="scenario ${scenario===x[0]?'selected':''}" onclick="chooseScenario('${x[0]}')">${x[1]}<b>${x[2]}</b><p>${x[3]}</p></button>`).join('')}</div></div><div class="field"><label for="project">所属项目</label><select id="project"><option>滨江科创中心 · 机电安装工程</option><option>西岸办公楼 · 装修改造工程</option></select></div><div class="field"><label for="tasktitle">任务名称</label><input id="tasktitle" type="text" maxlength="80" required placeholder="例如：电缆延期交付评估"></div><div class="field"><label for="description">需求描述</label><textarea id="description" required placeholder="说明发生了什么、涉及的数量和日期，以及希望解决的问题。"></textarea></div><div class="field"><label for="attachment">相关附件（可选）</label><div class="upload">▤ &nbsp;选择报价、通知或验收资料<br><input id="attachment" type="file" multiple style="margin-top:14px;max-width:100%"><p class="note">原型仅记录文件名，不上传或解析文件。</p></div></div><div class="result"><b>将参与的岗位</b>项目经理 Agent · 采购 Agent · 财务 Agent<br>系统生成分析与单据草稿，正式执行前提交人工确认。</div><div class="actions"><button type="button" onclick="nav('overview')">取消</button><button class="primary" type="submit">发起协同 →</button></div></form></div></div><aside><div class="card"><div class="sectionhead"><h2>让协作更准确</h2></div><div class="panelbody"><p style="font-size:12px;color:#77879c">提供关联订单、明确的物料规格、数量和期望日期，能帮助各岗位形成有依据的判断。</p><div class="result" style="margin-top:15px"><b>试试示例需求</b>电缆 200 米晚到五天，供应商可以先交一半，评估对施工的影响。</div><button class="textbtn" style="margin-top:20px" onclick="fillExample()">填入示例 ↗</button></div></div></aside></div>`}
function tasks(){return title('COLLABORATION TASKS','协同任务','每项任务都有明确的岗位分工、业务依据和处理状态。',`<button class="primary" onclick="nav('create')">＋ 发起协同</button>`)+`<div class="card"><div class="toolbar"><input type="text" value="${esc(search)}" id="search" placeholder="搜索任务名称、编号或场景" oninput="search=this.value;document.getElementById('taskrows').innerHTML=taskTable()"><span class="tiny">共 ${state.extra.length+3} 项演示任务</span></div>${tabs()}<div id="taskrows">${taskTable()}</div></div>`}
function documents(){return title('PROJECT DOCUMENTS','项目资料','业务分析引用的原始资料与单据版本。')+`<div class="card"><div class="sectionhead"><h2>滨江科创中心 · 项目资料</h2>${badge('演示资料','gray')}</div><div class="tablewrap"><table><thead><tr><th>资料名称</th><th>类型</th><th>版本</th><th>状态</th><th></th></tr></thead><tbody>${[['供应商延期通知.pdf','交期通知','V1'],['采购订单 PO-2026-0086','采购订单','V2'],['施工计划 V3.xlsx','施工计划','V3'],['电气材料预算台账.xlsx','预算台账','V1']].map((x,i)=>`<tr><td><b>▤ ${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${badge('已确认','green')}</td><td><button class="textbtn" onclick="evidence(${i})">查看依据 →</button></td></tr>`).join('')}</tbody></table></div></div>`}
function renderShell(){const titles={overview:'项目总览',tasks:'协同任务',create:'发起协同',workflow:'流程详情',approval:'人工审批',documents:'项目资料'};$('#app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">筑</div><div>筑序<small>PROJECT INTELLIGENCE</small></div></div><div class="workspace"><b>滨江科创中心 &nbsp;⌄</b><span>机电安装工程 · 项目空间</span></div><div class="navlabel">工作空间</div><nav class="nav">${[['overview','◫','项目总览'],['tasks','☷','协同任务'],['approval','✓','人工审批'],['documents','▤','项目资料']].map(x=>`<button class="${view===x[0]?'active':''}" onclick="nav('${x[0]}')"><em>${x[1]}</em>${x[2]}${x[0]==='approval'&&!state.decision?'<span class="count">3</span>':''}</button>`).join('')}</nav><div class="sidebottom"><div class="online"><span class="dot"></span>协作服务运行正常<br><span style="padding-left:13px;font-size:10px">3 个岗位 Agent 已就绪</span></div><div class="sidefoot"><span>交互原型 V0.1</span><button class="textbtn" style="color:#9aabc1;font-size:10px" onclick="resetDemo()">重置演示</button></div></div></aside><main class="main"><header><div class="crumb">工作空间 &nbsp; / &nbsp; <strong>${titles[view]}</strong></div><div class="header-right"><span class="demo">● 演示环境</span><span class="role">${esc(currentUser().name)} · ${esc(state.role)}</span><div class="avatar">${currentUser().name[0]}</div><button class="textbtn" onclick="logout()">退出登录</button></div></header><div class="content">${({overview,tasks,create,workflow,approval,documents}[view])()}<div class="footer"><span>筑序 · 让项目协作有据可循</span><span>演示数据 · 状态仅保存在本浏览器 · 不执行真实采购与付款</span></div></div></main></div>`}
function modal(title,body,actions=''){const returnFocus=document.activeElement;$('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><div class="sectionhead"><h3 id="dialogtitle">${title}</h3><button aria-label="关闭对话框" onclick="closeModal()">×</button></div><div class="panelbody">${body}${actions?'<div class="actions">'+actions+'</div>':''}</div></section></div>`;window.modalReturnFocus=returnFocus;$('#modal button').focus()}
function closeModal(){$('#modal').innerHTML='';window.modalReturnFocus?.focus()}
document.addEventListener('keydown',e=>{if(!$('#modal .dialog'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const nodes=[...$('#modal').querySelectorAll('button,input,textarea,select,a[href]')].filter(n=>!n.disabled);let first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function evidence(i=2){const docs=[['供应商延期通知','2026-11-02 · 第 1 页','原订单低压电缆共 200 米，可于 11 月 4 日交付 100 米指定规格，余量于 11 月 9 日到场。分批交货不增加运费。'],['采购订单 PO-2026-0086','订单 V2 · 电气材料','低压电缆 200 米，原定交货日 11 月 4 日。原供应商为华东电缆，订单状态：履约中。'],['施工计划','施工计划 V3 · 第 12 项','三层电缆敷设：11 月 4 日开始。前三天预计使用 80 米；后续工序需在 11 月 9 日前补足剩余材料。'],['电气材料预算台账','预算科目 ELEC-01 · V1','当前可用预算 ¥30,000。方案 A 增量 ¥0；方案 B 增量 ¥2,400，两项方案均通过演示预算检查。']][i];modal('资料依据',`<div class="tiny">演示资料 · ${docs[1]}</div><h3 style="margin-top:17px">${docs[0]}</h3><p style="font-size:13px;color:#68788e">${docs[2]}</p><div class="result">此处展示结构化证据预览。原型未加载真实附件。</div>`)}
function confirmApproval(){if(state.role!=='项目经理'||state.decision)return;state.comment=$('#comment').value.trim();modal('确认批准方案 '+state.option,`<p>批准后将模拟执行订单变更，处理方案与审批意见会保存在本浏览器。</p><div class="result"><b>方案 ${state.option}</b>${state.option==='A'?'原供应商分批交付 · 新增成本 ¥0':'备选供应商补充采购 · 新增成本 ¥2,400'}<br>当前审批人：林远 · 项目经理</div>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="decide('approved')">确认批准</button>`)}
function decide(d){if(state.role!=='项目经理'||state.decision)return;const comment=$('#comment')?.value.trim()||state.comment||'';if(d==='returned'&&!comment){toast('请填写退回原因');$('#comment').focus();return}state.decision=d;state.comment=comment;save();closeModal();render();toast(d==='approved'?'审批已记录，模拟订单变更完成':'方案已退回，采购岗位收到修改任务')}
function resubmit(){if(state.role!=='采购'){toast('请由采购人员补充后重新提交');return}state.decision=null;state.comment='';save();render();toast('演示方案已重新提交，等待审批')}

function taskDetail(id){if(id==='WF-2026-0140'&&state.role==='财务'){openFinanceReview();return}const t=[...state.extra,...baseTasks()].find(x=>x.id===id);modal('任务详情',`<div class="tiny">${esc(t.id)} · ${esc(t.type)}</div><h3 style="margin-top:15px">${esc(t.title)}</h3><p style="font-size:13px">${esc(t.description|| (t.type==='材料采购'?'需求中缺少钢管壁厚与交货批次，采购 Agent 已请求补充规格。':'订单、验收单与发票核对完成，付款申请草稿已准备。'))}</p>${badge(t.status,t.color)}<p class="note">${t.files?.length?'附件（仅文件名）：'+t.files.map(esc).join('、'):'未关联新增附件'}</p><div class="result">${t.type==='付款审核'?'付款申请仍需授权人员批准，本原型未执行付款。':'待补充关联单据与明确规格。原型不执行后台分析，可通过预置的电缆延期案例体验完整流程。'}</div>`,`<button onclick="closeModal()">关闭</button><button class="primary" onclick="closeModal();nav('workflow')">体验完整案例</button>`)}

let selectedLogin='pm';
function currentUser(){return users[sessionStorage.getItem('zhuxu-user')]||null}
function login(e){e.preventDefault();const account=$('#account').value.trim();if(!users[account]||$('#password').value!=='demo123'){$('#loginerror').textContent='账号或密码不正确，请使用页面中的演示账号。';return}sessionStorage.setItem('zhuxu-user',account);state.role=users[account].role;view='overview';render();toast('欢迎，'+users[account].name)}
function logout(){sessionStorage.removeItem('zhuxu-user');closeModal();view='overview';render()}
function selectLogin(id){selectedLogin=id;loginView()}
function loginView(){$('#app').innerHTML=`<div class="loginpage"><section class="loginintro"><div class="brand"><div class="logo">筑</div><div>筑序<small>PROJECT INTELLIGENCE</small></div></div><div class="introcopy"><div class="eyebrow">ENGINEERING COLLABORATION</div><h1>让每个岗位，<br>都能推进整个项目。</h1><p>项目经理掌握进度，采购保障交付，财务把控成本。<br>三个岗位独立工作，围绕同一项目持续协作。</p><div class="loginflow"><span>项目经理</span><i>⇄</i><span>采购</span><i>⇄</i><span>财务</span></div><div class="introstat"><div><b>03</b><small>独立岗位工作台</small></div><div><b>01</b><small>共享项目协作空间</small></div><div><b>全程</b><small>人工监督与业务留痕</small></div></div></div><div class="tiny">滨江科创中心 · 工程协同演示平台</div></section><section class="loginform"><div style="max-width:470px;width:100%"><div class="eyebrow">WELCOME TO ZHUXU</div><h1>登录你的岗位工作台</h1><p class="subtitle">选择演示账号，体验不同岗位的工作与协作边界。</p><div class="loginroles">${Object.entries(users).map(([id,u])=>`<button type="button" class="loginrole ${selectedLogin===id?'selected':''}" onclick="selectLogin('${id}')"><span class="agenticon ${u.color}">${u.role[0]}</span><b>${u.role}</b><small>${u.name}</small></button>`).join('')}</div><form onsubmit="login(event)"><div class="field"><label for="account">账号</label><input type="text" id="account" required autocomplete="username" value="${selectedLogin}"></div><div class="field"><label for="password">密码</label><input type="password" id="password" required autocomplete="current-password" value="demo123"></div><div id="loginerror" role="alert" style="color:#cc5762;font-size:12px;min-height:25px"></div><button class="primary" style="width:100%;padding:14px" type="submit">登录${users[selectedLogin].role}工作台 →</button></form><div class="result"><b>演示账号说明</b>项目经理 pm / 采购 buyer / 财务 finance<br>统一密码：demo123。此处为前端模拟登录，非正式身份认证。</div><p class="note">业务记录在当前浏览器共享，登录身份按标签页隔离，可分别登录三个角色观察协作。</p></div></section></div>`}
function roleOverview(){const u=currentUser(),buyer=u.role==='采购';return title(buyer?'PROCUREMENT WORKSPACE':'FINANCE WORKSPACE',buyer?'采购工作台':'财务工作台',`${u.name}，${buyer?'关注供应交付与采购方案，及时响应现场需求。':'关注预算占用和单据差异，让每笔支出有据可查。'}`,`<button onclick="nav('tasks')">协同任务</button><button class="primary" onclick="${buyer?"nav('create')":"openFinanceReview()"}">${buyer?'＋ 发起采购协同':'处理单据审核'}</button>`)+`<div class="metrics">${(buyer?[['待处理需求','6','项'],['交期风险','1','项'],['待审批采购','2','项'],['本月采购额','86.4','万元']]:[['待审核单据','4','项'],['预算使用率','68','%'],['单据异常','1','项'],['待付款申请','12.8','万元']]).map(m=>`<div class="card metric"><div class="metriclabel">${m[0]}</div><div class="metricvalue">${m[1]}<small>${m[2]}</small></div><div class="metricfoot">滨江科创中心 · 演示数据</div></div>`).join('')}</div><div class="layout"><div><div class="card"><div class="sectionhead"><h2>我的岗位待办</h2>${badge(u.role+'专属','blue')}</div><div class="panelbody"><h3 style="font-size:15px">${buyer?'电缆延期 · 交付方案跟踪':'空调设备首付款 · 单据审核'}</h3><p style="font-size:12px;color:#7c8a9c">${buyer?(state.decision==='returned'?'项目经理已退回方案，请根据意见补充资料后重新提交。':state.decision==='approved'?'项目经理已批准方案，可查看交付要求并跟踪到货。':'两种方案已提交项目经理，等待审批。采购人员可以查看进度和证据。'):(state.financeReviewed?'财务审核已完成，付款申请草稿已生成，等待授权人员批准。':'订单金额 ¥128,000，验收记录与发票已关联，待财务人员完成核对并生成付款申请草稿。')}</p><div class="actions"><button class="primary" onclick="${buyer?"nav('approval')":"openFinanceReview()"}">${buyer?'查看采购方案':'进入财务审核'} →</button></div></div></div><div class="card space"><div class="sectionhead"><h2>跨岗位协作记录</h2><small>共享项目状态</small></div>${taskTable()}</div></div><aside class="rightcol">${agents()}${activity()}</aside></div>`}
function openFinanceReview(){if(state.role!=='财务'){toast('此任务仅财务岗位可处理');return}modal('财务审核 · 空调设备首付款',`<p class="note">订单 PO-2026-0072 · 付款申请 PAY-2026-0021</p><table><tbody><tr><td>订单金额</td><td>¥128,000.00</td></tr><tr><td>验收记录</td><td>已确认，金额匹配</td></tr><tr><td>发票核对</td><td>金额一致，未发现重复</td></tr><tr><td>预算检查</td><td>科目余额充足</td></tr></tbody></table><div class="result">${state.financeReviewed?'✓ 财务审核已完成，付款申请草稿已生成。':'确认核对结果后生成付款申请草稿，实际付款仍需授权人员审批。'}</div>`,state.financeReviewed?'<button onclick="closeModal()">关闭</button>':'<button onclick="closeModal()">稍后处理</button><button class="primary" onclick="completeFinanceReview()">确认审核，生成草稿</button>')}
function completeFinanceReview(){if(state.role!=='财务')return;state.financeReviewed=true;save();closeModal();render();toast('财务审核完成，付款申请草稿已生成；未执行付款')}
function render(){const user=currentUser();if(!user){loginView();return}state.role=user.role;renderShell();if(view==='overview'&&user.role!=='项目经理'){$('.content').innerHTML=roleOverview()+`<div class="footer"><span>筑序 · ${esc(user.role)}工作台</span><span>演示数据 · 不执行真实采购与付款</span></div>`}else if(view==='overview'){$('h1').textContent='项目经理工作台';$('.subtitle').textContent='林远，掌握项目进度，确认现场需求，审批关键处理方案。'}const approveNav=$('.nav button:nth-child(3)');if(user.role!=='项目经理'){approveNav.innerHTML='<em>▤</em>方案与进度';}if(view==='approval'){const note=[...document.querySelectorAll('.note')].find(n=>n.textContent.includes('切换岗位'));if(note)note.textContent='当前登录：'+user.name+' · '+user.role+'。本方案仅项目经理可批准，采购负责补充和重新提交。';const btn=[...document.querySelectorAll('button')].find(n=>n.textContent==='模拟补充后重新提交');if(btn){btn.textContent='补充完成，重新提交';btn.disabled=user.role!=='采购';}const comments=$('#comment');if(comments&&user.role!=='项目经理')comments.disabled=true;document.querySelectorAll('input[name="option"]').forEach(n=>{if(user.role!=='项目经理')n.disabled=true})}}
window.addEventListener('storage',e=>{if(e.key==='zhuxu-prototype-v1'){try{const updated=JSON.parse(e.newValue);if(updated){state=updated;render()}}catch{}}});
render();

</script></body></html>
